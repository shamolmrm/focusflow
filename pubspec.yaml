name: focus_flow
description: "FocusFlow — AI-powered productivity and habit tracking app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # HTTP
  http: ^1.2.2

  # Storage
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.1.5
  firebase_analytics: ^11.4.0
  google_sign_in: ^6.2.2
  flutter_local_notifications: ^18.0.1

  # Charts / UI
  fl_chart: ^0.69.0
  confetti: ^0.7.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3

  # Fonts / Icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.8.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  device_info_plus: ^11.1.1


  # Payments
  purchases_flutter: ^8.3.0

  # Audio
  just_audio: ^0.9.42
  audio_session: ^0.1.21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.3.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4C3BCF"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
